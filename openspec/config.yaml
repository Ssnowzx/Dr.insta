schema: spec-driven

context: |
  Projeto: Myfavorite — sistema de estratégia e análise de Instagram operado por Claude Code.

  O que é: um conjunto de Agent Skills (padrão Anthropic) + um motor de métricas em
  TypeScript que transformam dados manuais do Instagram Insights em diagnóstico,
  plano editorial e relatórios acionáveis.

  Perfil atendido: conta única, nicho Moda/Lifestyle — rode o motor com `--nicho lifestyle`.
  Objetivo primário dos próximos 90 dias: fazer quem ainda não a segue virar seguidor
  (@bianca.olivo), com meta declarada de 1M até dezembro. Métrica-norte: seguidores
  líquidos/mês, 20.824 → 62.200 (ver perfil/metas.md). Em vigor desde 13/08/2026, por
  decisão da cliente. Antes: "o perfil que conversa" (12/08–13/08) e "caminho até a
  compra" (04/08–12/08), ambos fechados sem leitura — a relação com a loja passou para a
  equipe da My Favorite.

  Não é o gargalo: alcance. Julho fez 5.584.671 contas alcançadas (medido pela API; o print
  dizia 5.413.754), 304 mil compartilhamentos e 22 mil respostas em Stories. Comentários e
  saves são guard-rail com piso no próprio baseline — recalibrados em 20/08/2026 sobre o mês
  fechado medido pela API, porque os pisos anteriores vinham de uma amostra de 6 Reels e
  ficavam 3 a 4x abaixo da verdade. Desde 20/08 a plataforma também lê o TOTAL de seguidores
  ao vivo, 5x por dia: 715.517 em 20/08, contra a meta de 1M em 31/12.

  O gargalo tem DOIS degraus, e o segundo foi medido em 18/08/2026:
  - alcance → visita ao perfil: 6,42% (347.482 sobre 5,4M)
  - visita → seguidor: 5,99% (20.824 sobre 347.482) — 94 em cada 100 abrem e vão embora
  O segundo é decidido por bio, foto, destaques e posts fixados, não por conteúdo. Ele foi
  medido por dois caminhos independentes no mesmo mês: os dois números da conta e sete
  posts de feed coletados por API, que deram 5,86%.

  Stack: TypeScript strict (ESM, NodeNext), Vitest para testes e cobertura, zero
  dependências de runtime. Node >= 20.19.

  Convenções:
  - Arquivos em lowercase-com-hífen; tipos centralizados em src/tipos/index.ts.
  - Proibido `any`; sem herança de classes (composição).
  - Conventional Commits em português no imperativo (feat:, fix:, docs:, test:...).
  - Testes no padrão AAA (Arrange/Act/Assert), nomeados "deve ...".
  - Cobertura mínima de 80% (lines/statements/functions).

  Domínio:
  - Métricas são sempre normalizadas por ALCANCE, não por seguidores — o alcance é a
    base que o algoritmo do Instagram realmente usa para ranquear.
  - Os três sinais de ranqueamento tratados como primários: watch time (retenção),
    sends per reach (compartilhamentos em DM) e likes per reach.
  - Benchmarks vivem em src/dominio/benchmarks.ts e devem citar a fonte e a data.

rules:
  proposal:
    - Escreva em português do Brasil.
    - Inclua sempre uma seção "Fora de escopo".
    - "Amarre a proposta a uma métrica de Instagram observável — por exemplo sends/reach, saves/reach ou taxa de resposta."
  tasks:
    - Quebre em tarefas de no máximo 2 horas.
    - Toda mudança em src/ precisa de uma tarefa correspondente de teste.
  design:
    - Justifique qualquer nova dependência; o padrão do projeto é zero dependências de runtime.

operations:
  apply:
    guidance:
      - Rode `npm test` antes de marcar tarefas como concluídas.
      - Se alterar benchmarks, atualize a fonte e a data no mesmo commit.
  archive:
    guidance:
      - Resuma o impacto esperado em métricas antes de arquivar.
