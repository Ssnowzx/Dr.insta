# =============================================================================
# Bloco de servidor para o Nginx do HOST.
#
# Instalação:
#   sudo cp infra/nginx-myfavorite.conf /etc/nginx/sites-available/myfavorite
#   sudo ln -s /etc/nginx/sites-available/myfavorite /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d plataforma.seudominio.com.br
#
# Troque `plataforma.seudominio.com.br` e confira que APP_PORTA no .env bate
# com a porta do proxy_pass abaixo.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name plataforma.seudominio.com.br;

    # O certbot reescreve este bloco com o redirecionamento para 443.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plataforma.seudominio.com.br;

    # Preenchido pelo certbot.
    # ssl_certificate     /etc/letsencrypt/live/plataforma.seudominio.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/plataforma.seudominio.com.br/privkey.pem;

    # Prints do Insights dela chegam a 7 MB; a margem cobre envio múltiplo.
    # O padrão do Nginx é 1 MB — sem esta linha o upload falha com 413 e a
    # mensagem não diz que o limite é do proxy.
    client_max_body_size 64m;

    # Esta é a linha que faz o streaming valer. Com buffering ligado (padrão),
    # o Nginx grava o corpo inteiro em arquivo temporário ANTES de repassar —
    # o app só vê o upload quando ele já terminou, e o progresso na tela dela
    # trava em 100% enquanto o servidor ainda está trabalhando.
    proxy_request_buffering off;

    # Arquivo grande em 4G leva tempo. O padrão de 60s corta no meio.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    client_body_timeout   300s;

    # Documento de cliente: receita, conversão, demografia. Fora de buscador.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sem isto o app se acha em HTTP e recusa gravar o cookie `Secure` —
        # o login entra em laço: autentica, redireciona, pede login de novo.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Os ativos do Next levam hash no nome: mudou o conteúdo, mudou a URL.
    # Cachear por um ano é seguro e é o que salva o carregamento em 4G.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
