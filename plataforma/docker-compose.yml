name: myfavorite

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # `--default-time-zone=+00:00` é o que sustenta a promessa do esquema:
    # todo DATETIME gravado é UTC. Sem isto, o fuso do contêiner entra na
    # conta e CURRENT_TIMESTAMP passa a mentir.
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${BANCO_SENHA_ROOT:?defina BANCO_SENHA_ROOT no .env}
      MYSQL_DATABASE: ${BANCO_NOME:-myfavorite}
      MYSQL_USER: ${BANCO_USUARIO:-myfavorite}
      MYSQL_PASSWORD: ${BANCO_SENHA:?defina BANCO_SENHA no .env}
      TZ: UTC
    volumes:
      - mysql-dados:/var/lib/mysql
    # Sem `ports:` de propósito. Uma 3306 publicada na internet é a forma mais
    # comum de perder um banco em VPS — o app fala com ele pela rede interna.
    networks: [interna]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: UTC
      BANCO_HOST: db
      BANCO_PORTA: 3306
      BANCO_NOME: ${BANCO_NOME:-myfavorite}
      BANCO_USUARIO: ${BANCO_USUARIO:-myfavorite}
      BANCO_SENHA: ${BANCO_SENHA:?defina BANCO_SENHA no .env}
      APP_URL: ${APP_URL:?defina APP_URL no .env}
      ARQUIVOS_RAIZ: /var/lib/myfavorite/arquivos
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORTA: ${SMTP_PORTA:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_REMETENTE: ${SMTP_REMETENTE:-}
    volumes:
      # Bind mount, não volume nomeado: o backup por rsync precisa enxergar
      # estes arquivos do host sem entrar no contêiner.
      - ${ARQUIVOS_HOST:-./arquivos}:/var/lib/myfavorite/arquivos
    # Só no loopback. Quem fala com a internet é o Nginx do host.
    ports:
      - "127.0.0.1:${APP_PORTA:-3080}:3000"
    networks: [interna]

volumes:
  mysql-dados:

networks:
  interna:
    driver: bridge
