# =============================================================================
# Server block for the HOST's Nginx.
#
# Install:
#   sudo cp infra/nginx-myfavorite.conf /etc/nginx/sites-available/myfavorite
#   sudo ln -s /etc/nginx/sites-available/myfavorite /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d plataforma.seudominio.com.br
#
# Replace `plataforma.seudominio.com.br` and make sure APP_PORT in .env matches
# the proxy_pass port below.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name plataforma.seudominio.com.br;

    # certbot rewrites this block with the redirect to 443.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plataforma.seudominio.com.br;

    # Filled in by certbot.
    # ssl_certificate     /etc/letsencrypt/live/plataforma.seudominio.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/plataforma.seudominio.com.br/privkey.pem;

    # Her Insights screenshots reach 7 MB; the margin covers multi-file uploads.
    # Nginx defaults to 1 MB — without this line the upload fails with a 413
    # whose message never says the limit came from the proxy.
    client_max_body_size 64m;

    # This is the line that makes streaming actually stream. With buffering on
    # (the default) Nginx writes the whole body to a temp file BEFORE forwarding
    # it — the app only sees the upload once it has finished, and the progress
    # bar on her screen sits at 100% while the server is still working.
    proxy_request_buffering off;

    # A large file over 4G takes time. The 60s default cuts it off mid-transfer.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    client_body_timeout   300s;

    # Client documents: revenue, conversion, demographics. Keep out of search.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app believes it is on HTTP and refuses to set the
        # `Secure` cookie — sign-in then loops: authenticate, redirect, ask
        # again.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next's assets carry a hash in the filename: different content, different
    # URL. Caching for a year is safe, and it is what saves the load over 4G.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
